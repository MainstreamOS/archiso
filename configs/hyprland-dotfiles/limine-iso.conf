timeout: 15

# ── Mainstream OS brand palette (see brand.html) ──────────────────────────
# Background: Night (#191A1F, Surface/01).
# interface_branding_colour / interface_help_colour now take RRGGBB hex
# (breaking change in Limine 12.0.0 — old 0-7 index removed).
# interface_help_colour_bright controls the auto-boot countdown digit accent
# (new in Limine 12.0.0).
#
# Stream A  oklch(0.62 0.13 200)  ≈  #18A0BE  (cyan-teal accent)
# Stream B  oklch(0.60 0.14 230)  ≈  #2196C5  (ocean blue accent)
# Bone      #C9CCD4               — primary foreground / branding text
# Mist      #9397A0               — secondary / help text
term_background:        191A1F
term_foreground:        C9CCD4
term_background_bright: 2A2B32
term_foreground_bright: ECE9E3
interface_branding:            Mainstream OS
interface_branding_colour:     18A0BE
interface_help_colour:         9397A0
interface_help_colour_bright:  2196C5
term_palette:          191A1F;D98888;7FA88C;D9B373;008DC3;8A7FB2;009CA5;C9CCD4
term_palette_bright:   40434A;EAA0A0;9EC9AA;EFCB94;00B3D4;A99DC9;00B3D4;ECE9E3
backdrop:              191A1F

# %INSTALL_DIR%, %ARCH%, and %ARCHISO_UUID% are replaced at ISO build time
# by the Limine bootmode functions in bootmodes/limine.sh.
#
# boot():// refers to the volume on which limine.conf was found.  Limine
# scans all accessible partitions for its config; when it finds this file
# on the ISO9660 partition, that partition becomes the root of boot()://.

# Microcode initrd lines reference both Intel and AMD ucode images.
# CPUs ignore the microcode that doesn't match their vendor — the matching
# one gets applied before the regular initramfs loads. finalize-install
# removes the unused microcode package post-install, but the bootloader
# entries reference both so a "wrong-removed" microcode never strands the
# user at a non-booting system.

/Mainstream OS — Live (default)
    protocol: linux
    kernel_path: boot():///%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
    module_path: boot():///%INSTALL_DIR%/boot/%ARCH%/intel-ucode.img
    module_path: boot():///%INSTALL_DIR%/boot/%ARCH%/amd-ucode.img
    module_path: boot():///%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
    cmdline: archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3 copytoram=n cow_spacesize=1G

# Fallback for hardware where KMS doesn't work at all. Drops to VESA
# framebuffer — low-res, slow, but boots when nothing else does.
/Mainstream OS — Live (Safe graphics)
    protocol: linux
    kernel_path: boot():///%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
    module_path: boot():///%INSTALL_DIR%/boot/%ARCH%/intel-ucode.img
    module_path: boot():///%INSTALL_DIR%/boot/%ARCH%/amd-ucode.img
    module_path: boot():///%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
    cmdline: archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset vga=normal copytoram=n cow_spacesize=1G
