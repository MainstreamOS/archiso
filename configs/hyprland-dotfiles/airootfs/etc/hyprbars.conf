# /etc/hyprbars.conf
# Configuration for /usr/local/lib/hyprbars/rebuild.sh — the pacman hook
# that rebuilds the hyprbars Hyprland plugin on every `hyprland`
# install/upgrade.
#
# Defaults below pin both source and ref to the MainstreamOS fork's
# `mainstream` branch, which carries our Hyprland 0.55 API port
# (configStringToInt → Config::ParserUtils::parseColor). Upstream
# `hyprwm/hyprland-plugins` had not landed that port at ISO build
# time, so leaving these unset would have rebuild.sh walk through
# upstream history and fail every candidate against the 0.55
# headers we ship.
#
# Sourced as bash — comment any line below to fall back to the
# zero-touch upstream auto-detect behavior documented in rebuild.sh.

# Source repo for hyprland-plugins.
HYPRBARS_REPO="https://github.com/MainstreamOS/hyprland-plugins"

# Pin to an explicit ref (tag, branch, or commit SHA). When set, the
# auto-detect / fallback chain is skipped and a build failure is fatal.
# We pin to `mainstream` so rebuild.sh stays on our 0.55-fixed branch
# whenever upstream history rolls forward — even after the pacman hook
# fires for a future Hyprland upgrade.
HYPRBARS_REF="mainstream"

# Cap on how many commits the auto-walk-back will try after primary
# candidates fail. Each attempt is a clean build (~10 sec on modern
# hardware). Only consulted when HYPRBARS_REF is unset.
#WALK_DEPTH=50
