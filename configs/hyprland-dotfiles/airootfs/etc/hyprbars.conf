# /etc/hyprbars.conf
# Configuration for /usr/local/lib/hyprbars/rebuild.sh — the pacman hook
# that rebuilds the hyprbars Hyprland plugin on every `hyprland`
# install/upgrade.
#
# Defaults below pin source + ref to upstream hyprwm/hyprland-plugins
# at v0.55.0, matching the Hyprland 0.55.0 the ISO ships. The
# auto-detect chain in rebuild.sh would converge on the same tag
# (`auto_detect_refs` tries `v<HYPR_VER>` first), but pinning makes
# every fresh-install rebuild deterministic and skips the tag-probing
# git fetches.
#
# Sourced as bash — comment any line below to fall back to the
# zero-touch upstream auto-detect behavior documented in rebuild.sh.

# Source repo for hyprland-plugins.
HYPRBARS_REPO="https://github.com/hyprwm/hyprland-plugins"

# Pin to an explicit ref (tag, branch, or commit SHA). When set, the
# auto-detect / fallback chain is skipped and a build failure is fatal.
# Pinned to v0.55.0 to match the shipped Hyprland version. Bumping
# Hyprland past 0.55.x means bumping this too — or removing the pin
# and letting rebuild.sh auto-detect the matching plugin tag.
HYPRBARS_REF="v0.55.0"

# Cap on how many commits the auto-walk-back will try after primary
# candidates fail. Each attempt is a clean build (~10 sec on modern
# hardware). Only consulted when HYPRBARS_REF is unset.
#WALK_DEPTH=50
