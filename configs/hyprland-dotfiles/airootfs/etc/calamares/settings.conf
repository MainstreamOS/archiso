# Calamares settings for Mainstream Dotfiles installer

modules-search: [ /etc/calamares/modules, local, /usr/lib/calamares/modules ]

navigation-style: horizontal

# Per-instance weights below tilt the progress bar toward the actually
# slow steps (dotfiles build, GPU driver install, packages module's
# yay run). Calamares' default is 1 per instance — same as a 1-second
# step like `hwclock` — so without these the bar fills to ~85% by the
# time the slow work even starts and then crawls through the last
# quarter. Reweighting puts the slow steps where they belong on the
# bar so "60% → 95%" corresponds to "downloading and building things"
# instead of "config setup".
#
# Module-level weights (from each module.desc): unpackfs ships
# weight: 12 upstream; packages's module.desc in this repo carries
# weight: 30. The numbers below are tuned around those.
instances:
  - id:     preinstall
    module: shellprocess
    config: preinstall.conf
  - id:     yay
    module: shellprocess
    config: yay.conf
  - id:     dotfiles
    module: shellprocess
    config: dotfiles.conf
    # install-dotfiles copies the dotfiles tree to /etc/skel and installs
    # a small REQUIRED_EXTRAS list (~6 packages). Measured at ~2 min total
    # — modest compared with the package install and post-install phases.
    weight: 5
  - id:     limine
    module: shellprocess
    config: limine.conf
  - id:     installgpudrivers
    module: shellprocess
    config: installgpudrivers.conf
    # NVIDIA / AMD / Intel driver detection + install, including kernel
    # modules and DKMS for NVIDIA. Skipped fast on iGPU-only hardware
    # but can dominate on dGPU machines.
    weight: 4
  - id:     postinstall
    module: shellprocess
    config: postinstall.conf
    # The actual longest step in measured installs. post-install does
    # GPU env wiring, hypridle patches, kernel cmdline rewrites, SDDM
    # /Hyprland integration, several pacman -S calls for system packages,
    # and systemd service registration. On NVIDIA setups the DKMS module
    # compile that lands here adds minutes more. Heavy weight reflects
    # that reality.
    weight: 25
  - id:     desktopcleanup
    module: shellprocess
    config: desktopcleanup.conf

sequence:
  - show:
    - welcome
    - locale
    - keyboard
    - partition
    - users
    - installmethod
    - netinstall
    - summary
  - exec:
    - partition
    - mount
    - unpackfs
    - machineid
    - fstab
    - locale
    - keyboard
    - localecfg
    - luksbootkeyfile
    - initcpiocfg
    - users
    - removeuser
    - displaymanager
    - networkcfg
    - hwclock
    - shellprocess@preinstall
    - shellprocess@yay
    - shellprocess@dotfiles
    - shellprocess@limine
    - shellprocess@installgpudrivers
    - shellprocess@postinstall
    - packages
    - shellprocess@desktopcleanup
    - services-systemd
    - umount
  - show:
    - finished

branding: hyprland

prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false
