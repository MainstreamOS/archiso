# Calamares settings for Mainstream Dotfiles installer

modules-search: [ /etc/calamares/modules, local, /usr/lib/calamares/modules ]

navigation-style: horizontal

# Per-instance weights tuned to actual wall-clock from a real install run
# (AMD RX 9070, fast internet). Weight ~= seconds / 6, so 1 unit ~= 6s of
# perceived progress; unmeasured fast config steps (locale, fstab, hwclock,
# etc.) stay at the default 1 and collectively occupy a small slice.
#
# Measured:
#   unpackfs                       111s -> weight 19
#   shellprocess@preinstall        48s  -> weight 8
#   shellprocess@dotfiles          3s   -> weight 1
#   shellprocess@limine            21s  -> weight 4
#   shellprocess@installgpudrivers 5s on AMD / ~90s on NVIDIA (DKMS compile)
#                                  -> weight 15, sized for the NVIDIA path so it
#                                  does not freeze; AMD passes through quickly
#   shellprocess@post* (3 groups)  114s total:
#     boot 57s -> 10 . desktop 29s -> 5 . finalize 28s -> 5
#   packages module                232s -> weight 39  (see packages/module.desc;
#                                  mostly flatpak runtime installs)
#   shellprocess@finalizeinstall   72s  -> weight 12
instances:
  - id:     main
    module: unpackfs
    config: unpackfs.conf
    # unpackfs ships weight 12 in its upstream module.desc. Reference
    # this instance from the sequence as `unpackfs@main` to override.
    weight: 19
  - id:     preinstall
    module: shellprocess
    config: preinstall.conf
    weight: 8
  - id:     dotfiles
    module: shellprocess
    config: dotfiles.conf
    # install-dotfiles copies the dotfiles tree to /etc/skel and
    # installs a small REQUIRED_EXTRAS list (~6 packages). Measured
    # at well under a minute — the dotfile copy dominates, the pkg
    # installs are mostly cache hits at this point in the sequence.
    weight: 1
  - id:     limine
    module: shellprocess
    config: limine.conf
    weight: 4
  - id:     installgpudrivers
    module: shellprocess
    config: installgpudrivers.conf
    # GPU driver detection + install + DKMS module build. On NVIDIA
    # setups the kernel-module compile lands here. Sized to ~1.5 min
    # — split from the original 25 to leave headroom for the packages
    # module to absorb users with large netinstall selections.
    weight: 15
  # The post-install phase runs as 3 grouped weighted shellprocess steps so the
  # installer shows a labeled progress jump per phase. Weights track the
  # measured ~1.9 min — boot (~57s, initramfs+plymouth+GPU) is the long pole;
  # desktop (~29s) and finalize (~28s) are the lighter two.
  - id:     postboot
    module: shellprocess
    config: postboot.conf
    weight: 10
  - id:     postdesktop
    module: shellprocess
    config: postdesktop.conf
    weight: 5
  - id:     postfinalize
    module: shellprocess
    config: postfinalize.conf
    weight: 5
  - id:     finalizeinstall
    module: shellprocess
    config: finalizeinstall.conf
    # Final post-install cleanup pass — removes wrong-vendor GPU drivers that
    # leaked in via --noconfirm provider auto-selection (e.g. Steam pulling
    # lib32-nvidia-utils on AMD; must run AFTER the packages module), the
    # wrong CPU microcode, live-only installer tooling, and the live-only
    # sudoers drop-ins + /home/liveuser leftovers. Runs pacman -Rns.
    weight: 12
  - id:     desktopcleanup
    module: shellprocess
    config: desktopcleanup.conf

sequence:
  - show:
    - welcome
    - locale
    - keyboard
    - partition
    - users
    - installmethod
    - netinstall
    - summary
  - exec:
    - ntfscheck
    - partition
    - mount
    - unpackfs@main
    - machineid
    - fstab
    - locale
    - keyboard
    - localecfg
    - luksbootkeyfile
    - initcpiocfg
    - removeuser
    - users
    - displaymanager
    - networkcfg
    - hwclock
    - shellprocess@preinstall
    - shellprocess@dotfiles
    - shellprocess@limine
    - shellprocess@installgpudrivers
    - shellprocess@postboot
    - shellprocess@postdesktop
    - shellprocess@postfinalize
    - packages
    - contextualprocess
    - shellprocess@finalizeinstall
    - shellprocess@desktopcleanup
    - services-systemd
    - umount
  - show:
    - finished

branding: hyprland

prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false
