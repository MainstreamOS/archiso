# Calamares settings for Mainstream Dotfiles installer

modules-search: [ /etc/calamares/modules, local, /usr/lib/calamares/modules ]

navigation-style: horizontal

# Per-instance weights tuned to actual wall-clock measurements from a
# real install run on fast hardware + fast internet. Numbers are
# minutes × 10 so 1 weight unit ≈ 6 seconds of perceived progress;
# unmeasured "fast" config-style steps (locale, fstab, hwclock, etc.)
# stay at the default 1 and collectively occupy a small slice.
#
# Measured times:
#   unpackfs                       2 min  → weight 20  (also see unpackfs instance)
#   shellprocess@preinstall        1 min  → weight 10
#   shellprocess@dotfiles          ~30s   → weight 5
#   shellprocess@limine            1 min  → weight 10
#   shellprocess@installgpudrivers ~1.5min (DKMS)         → weight 15
#   shellprocess@postinstall       2 min                  → weight 20
#   packages module                2 min baseline, more   → weight 30  (see packages/module.desc)
#                                  if the user added many
#                                  netinstall extras
instances:
  - id:     main
    module: unpackfs
    config: unpackfs.conf
    # unpackfs ships weight 12 in its upstream module.desc. Reference
    # this instance from the sequence as `unpackfs@main` to override.
    weight: 20
  - id:     preinstall
    module: shellprocess
    config: preinstall.conf
    weight: 10
  - id:     dotfiles
    module: shellprocess
    config: dotfiles.conf
    # install-dotfiles copies the dotfiles tree to /etc/skel and
    # installs a small REQUIRED_EXTRAS list (~6 packages). Measured
    # at well under a minute — the dotfile copy dominates, the pkg
    # installs are mostly cache hits at this point in the sequence.
    weight: 5
  - id:     limine
    module: shellprocess
    config: limine.conf
    weight: 10
  - id:     installgpudrivers
    module: shellprocess
    config: installgpudrivers.conf
    # GPU driver detection + install + DKMS module build. On NVIDIA
    # setups the kernel-module compile lands here. Sized to ~1.5 min
    # — split from the original 25 to leave headroom for the packages
    # module to absorb users with large netinstall selections.
    weight: 15
  - id:     postinstall
    module: shellprocess
    config: postinstall.conf
    # GPU env wiring, hypridle patches, kernel cmdline rewrites,
    # SDDM/Hyprland integration, several pacman -S calls. Measured 2 min.
    weight: 20
  - id:     finalizeinstall
    module: shellprocess
    config: finalizeinstall.conf
    # Final post-install cleanup pass — removes wrong-vendor GPU drivers that
    # leaked in via --noconfirm provider auto-selection (e.g. Steam pulling
    # lib32-nvidia-utils on AMD; must run AFTER the packages module), the
    # wrong CPU microcode, live-only installer tooling, and the live-only
    # sudoers drop-ins + /home/liveuser leftovers. Runs pacman -Rns.
    weight: 6
  - id:     desktopcleanup
    module: shellprocess
    config: desktopcleanup.conf

sequence:
  - show:
    - welcome
    - locale
    - keyboard
    - partition
    - users
    - installmethod
    - netinstall
    - summary
  - exec:
    - ntfscheck
    - partition
    - mount
    - unpackfs@main
    - machineid
    - fstab
    - locale
    - keyboard
    - localecfg
    - luksbootkeyfile
    - initcpiocfg
    - users
    - removeuser
    - displaymanager
    - networkcfg
    - hwclock
    - shellprocess@preinstall
    - shellprocess@dotfiles
    - shellprocess@limine
    - shellprocess@installgpudrivers
    - shellprocess@postinstall
    - packages
    - shellprocess@finalizeinstall
    - shellprocess@desktopcleanup
    - services-systemd
    - umount
  - show:
    - finished

branding: hyprland

prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false
