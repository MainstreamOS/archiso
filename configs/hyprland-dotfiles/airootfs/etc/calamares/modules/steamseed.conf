---
# Console Mode Steam Deck client pre-provision. The script does nothing: the
# client cannot be fetched from the live session, which has no room to install
# Steam, and the target's first-boot preload timer downloads it instead. The
# step is kept so the installer sequence is unchanged. The leading "-" makes
# any failure non-fatal.
i18n:
    name: "Preparing the gaming client"
dontChroot: true
timeout: 1800

script:
    - "-/usr/local/bin/mainstream-steam-seed-live"
