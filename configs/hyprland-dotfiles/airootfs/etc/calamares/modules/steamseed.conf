---
# Console Mode Steam Deck client pre-provision. Runs outside the chroot
# (dontChroot: true) in the live installer, where Steam has a real user session,
# and lands the Deck-branch client on the target disk (${ROOT}) so the first
# boot into gaming isn't a multi-minute download. ${ROOT} is Calamares'
# expansion token for the target mount point (this Calamares does not support
# @@ROOT@@). The leading "-" makes any failure non-fatal — the target's
# first-boot preload timer is the fallback. The script self-gates on the Console
# boot-target marker, so non-Console installs run it as a fast no-op.
i18n:
    name: "Preparing the gaming client"
dontChroot: true
timeout: 1800

script:
    - "-/usr/local/bin/mainstream-steam-seed-live ${ROOT}"
