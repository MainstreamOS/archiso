---
# Persist the Calamares session log on the installed system. Runs outside the
# chroot (the log lives on the live system) as the last exec step before
# umount. ${ROOT} is Calamares' expansion token for the target mount point
# (this Calamares does not support @@ROOT@@). The leading "-" makes any
# failure non-fatal — never abort an otherwise-complete install over a log
# copy.
i18n:
    name: "Saving install log"
dontChroot: true
timeout: 60
# Run even when the installation FAILS (the log matters most then). Requires
# the emergency-capable shellprocess module shipped by calamares-mainstream;
# failed installs skip every non-emergency job, including umount, so the
# target is still mounted when this runs.
emergency: true

script:
    - "-/usr/local/bin/save-install-log ${ROOT}"
