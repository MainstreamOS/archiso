---
# Removes the live session's settings from the target: passwordless sudo, root
# password login over SSH, the tty1 autologin, volatile logs and the suspend
# block. finalize-install does this on every install that reaches it; this
# instance repeats it as an emergency job, so an install that fails after the
# system became bootable is not left with those settings. Requires the
# emergency-capable shellprocess module shipped by calamares-mainstream. The
# leading "-" keeps a problem here from changing the outcome of an install.
i18n:
    name: "Removing live session settings"
dontChroot: false
timeout: 60
emergency: true

script:
    - "-/usr/local/bin/finalize-install --security-cleanup"
