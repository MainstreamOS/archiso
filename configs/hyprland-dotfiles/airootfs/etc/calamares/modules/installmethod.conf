---
# "Get Started" picker shown right before the netinstall page.
# Five-card radio choice:
#   default    — auto-install everything in the default-apps netinstall
#                group and skip the netinstall page (recommended for
#                newcomers)
#   custom     — proceed to netinstall for hand-picking
#   developer  — auto-install the developer-tools netinstall group
#   gaming     — auto-install the gaming netinstall group
#   os-only    — skip netinstall, install nothing optional
#
# The selection drives downstream behavior via GlobalStorage keys
# (installmethod_choice, installmethod_skipnetinstall, and
# installmethod_preselect_group). The netinstall ViewStep reads these
# in onActivate() and self-skips when appropriate.

defaultChoice: "default"

# Each *GroupName must match a `name:` in netinstall.yaml exactly so
# netinstall can pre-check the right tree.
defaultAppsGroupName: "📦 Included Extras"
developerGroupName:   "💻 Developer Tools"
gamingGroupName:      "🎮 Gaming"
