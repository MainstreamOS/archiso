---
# Optional software selection — shown as a checkbox tree between the users
# and summary steps.
#
# groupsUrl: local means groups are defined inline in this file.
# Selected packages are written to GlobalStorage "packageOperations" and
# installed by the "packages" module in the exec sequence.
#
# selected: false — all packages start unchecked so none are installed by
# default. The user checks whatever they want.
#
# Package source encoding:
#   - Names containing dots (e.g. com.spotify.Client) are Flatpak refs;
#     PMYay auto-routes them to `flatpak install --system flathub <ref>`.
#   - Everything else is a native Arch / AUR package installed via yay.
# This switch keeps the "must-be-native" set on real Arch packages
# (terminal tools, system daemons, kernel/compositor hooks, mpv +
# its plugins, davinci-resolve) while moving everything else to
# Flathub so it doesn't pollute the pacman world with AUR-binary
# downloads, doesn't need rebuild hooks on every Hyprland upgrade,
# and stays sandboxed by default.
#
# Cross-group checkbox sync (calamares fork 005c5c02) keeps duplicates
# in lockstep — checking spotify in Included Extras also checks the
# spotify entry in Media, and finalizeGlobalStorage dedupes by name
# so the install runs once.

groupsUrl: local

groups:
    - name: "📦 Included Extras"
      description: "Recommended apps pre-selected for a complete desktop. Uncheck any you don't want."
      selected: true
      critical: false
      packages:
