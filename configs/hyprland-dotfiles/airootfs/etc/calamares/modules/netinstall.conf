---
# Optional software selection — shown as a checkbox tree between the users
# and summary steps.
#
# groupsUrl: local means groups are defined inline in this file.
# Selected packages are written to GlobalStorage "packageOperations" and
# installed by the "packages" module in the exec sequence.
#
# selected: false — all packages start unchecked so none are installed by
# default. The user checks whatever they want.
#
# Each package entry has three relevant fields:
#   name:    install identifier — what gets passed to `yay -S` or
#            `flatpak install`. Names containing dots are Flatpak refs
#            (PMYay auto-routes them to flatpak), everything else is a
#            native Arch / AUR package.
#   display: friendly label shown in the checkbox list AND in the
#            per-install "Installing X" status text. Decoupled from
#            `name:` so Flatpak refs (com.spotify.Client) and Arch
#            package names (gnome-disk-utility) don't appear raw to
#            the user. Picked up by PackageTreeItem.cpp (Calamares
#            fork) and read back from the operation dict by PMYay's
#            _unpack() in packages/main.py.
#   description: longer second-column blurb explaining what the app
#            is and which path it's installed from.
#
# Cross-group sync (calamares fork 005c5c02) keeps duplicates in lockstep
# by `name:` equality, so checking Spotify in Included Extras also checks
# it in Media, and finalizeGlobalStorage dedupes by name to install once.
#
# "Must-be-native" set kept on native Arch / AUR:
#   gnome-disk-utility, gnome-software, gamescope, docker,
#   plex-media-server, jellyfin-server, stacer, ventoy,
#   htop, btop, vim, neovim, ghostty, alacritty,
#   mangohud, goverlay,
#   mpv + mpv-modernz + mpv-thumbfast (scripts can't load in Flatpak mpv),
#   davinci-resolve,
#   code (FOSS build; Flathub only has the proprietary one),
#   spotify (native — required by hyprland/scripts/toggle_gamescope.sh's
#            D-Bus name matcher, plus gamers report fewer issues with the
#            native build vs the Flatpak sandbox).

groupsUrl: local

groups:
    - name: "📦 Included Extras"
      description: "Recommended apps pre-selected for a complete desktop. Uncheck any you don't want."
