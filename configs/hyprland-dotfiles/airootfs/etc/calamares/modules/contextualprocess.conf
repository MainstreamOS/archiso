#
# Boot-target wiring for the "Get Started" picker. When the user picks
# Console Mode the installmethod module writes installmethod_choice=console
# to GlobalStorage; this job then seeds the mainstream-gaming boot
# preference in the target so the installed system autologins straight into
# the Steam gamescope session on first boot. gaming-mode-arm-check resolves
# the autologin account from the lowest-uid human user, so no username is
# threaded in here. Every other choice matches no value and runs nothing.
---
dontChroot: false
installmethod_choice:
    console:
        - "install -d -m 0755 /etc/mainstream-gaming && printf 'boot-target=gaming\\n' > /etc/mainstream-gaming/prefs.conf && chmod 0644 /etc/mainstream-gaming/prefs.conf"
