#
# Console Mode wiring for the "Get Started" picker. When the user picks
# Console Mode the installmethod module writes installmethod_choice=console
# to GlobalStorage; this job seeds the mainstream-gaming boot preference in the
# target so the installed system autologins straight into the Steam gamescope
# session on first boot. gaming-mode-arm-check resolves the autologin account
# from the lowest-uid human user, so no username is threaded in here. The Steam
# Deck client itself is fetched by the shellprocess@steamseed job that runs
# next (it self-gates on the boot-target=gaming marker written here). Console
# installs also get the controller packages (Xbox Bluetooth driver + the
# game-devices udev rules) — one non-fatal "-" command per package so a
# missing repo entry or offline install skips that package without failing
# the install or the other one. Every other choice matches no value and runs
# nothing.
---
dontChroot: false
installmethod_choice:
    console:
        - "install -d -m 0755 /etc/mainstream-gaming && printf 'boot-target=gaming\\n' > /etc/mainstream-gaming/prefs.conf && chmod 0644 /etc/mainstream-gaming/prefs.conf"
        - "-pacman -S --needed --noconfirm mainstream-xpadneo"
        - "-pacman -S --needed --noconfirm game-devices-udev"
