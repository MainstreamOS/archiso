---
# Calamares Welcome module

showSupportUrl: true
showKnownIssuesUrl: true
showReleaseNotesUrl: true
showDonateUrl: true

requirements:
    requiredStorage: 20
    requiredRam: 2.0
    internetCheckUrl:
        - https://archlinux.org
        - https://geo.mirror.pkgbuild.com
        - https://github.com
    check:
        - storage
        - ram
        - power
        - internet
        - root
        - screen
    # The kernel, the graphics drivers and the chosen apps are downloaded
    # during the install, after the disk has been partitioned and unpacked.
    # Starting offline would leave a wiped disk and an install that stops
    # partway, and this page is the last place that can be said before
    # anything is written. One reachable address in the list above is enough.
    required:
        - storage
        - ram
        - internet
        - root
