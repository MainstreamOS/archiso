---
# Calamares Welcome module

showSupportUrl: true
showKnownIssuesUrl: true
showReleaseNotesUrl: true
showDonateUrl: true

requirements:
    requiredStorage: 20
    requiredRam: 2.0
    internetCheckUrl: https://archlinux.org
    check:
        - storage
        - ram
        - power
        - internet
        - root
        - screen
    # install-dotfiles clones the dotfiles over the network and aborts outright
    # without them, and it runs after the disk has been partitioned, unpacked
    # and given a user. Beginning an install offline therefore does not produce
    # a system missing its dotfiles — it produces a wiped disk and an install
    # that stops nineteen steps in. This page is the last place that can be
    # said before anything is written.
    required:
        - storage
        - ram
        - internet
        - root
