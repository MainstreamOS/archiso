---
# Step 4 of 5: write Limine bootloader config
i18n:
    name: "Configuring bootloader"
dontChroot: false
# install-limine re-downloads the linux package over the network when a
# connection is available; a slow mirror can take several minutes for the
# ~150 MB kernel, and hitting this timeout fails the whole install.
timeout: 600

script:
    - "/usr/local/bin/install-limine"
