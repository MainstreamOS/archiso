---
# Step 4 of 5: write Limine bootloader config
i18n:
    name: "Configuring bootloader"
dontChroot: false
# install-limine downloads the chosen kernels the image does not carry (on the
# MacBook edition it reinstalls linux-t2), and a slow mirror can take several
# minutes; hitting this timeout fails the whole install. Otherwise the kernel
# is a local file copy and finishes in seconds.
timeout: 3600

script:
    - "/usr/local/bin/install-limine"
