---
# Step 4 of 5: write Limine bootloader config
i18n:
    name: "Configuring bootloader"
dontChroot: false
# With a network connection install-limine reinstalls the ~150 MB linux
# package, and a slow mirror can take several minutes; hitting this timeout
# fails the whole install. Offline, the kernel restore is a local file copy
# and finishes in seconds.
timeout: 600

script:
    - "/usr/local/bin/install-limine"
