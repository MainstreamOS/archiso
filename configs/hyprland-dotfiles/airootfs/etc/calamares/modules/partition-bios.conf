---
# Partition module config

# ---------------------------------------------------------------------------
# EFI system partition
# Note: efiSystemPartition / efiSystemPartitionSize / efiSystemPartitionName
# are deprecated aliases — use the efi: block below instead (Calamares 3.3+)
# ---------------------------------------------------------------------------
efi:
    mountPoint:      "/boot/efi"
    recommendedSize: 1024MiB
    minimumSize:     512MiB
    label:           "EFI"

# ---------------------------------------------------------------------------
# Filesystem
# ---------------------------------------------------------------------------
defaultFileSystemType: "btrfs"
availableFileSystemTypes:
    - btrfs

# ---------------------------------------------------------------------------
# Partitioning defaults
# ---------------------------------------------------------------------------
# Force GPT — required for EFI-only installs with Limine
requiredPartitionTableType: gpt

# Erase disk is what the page opens on; the layout, filesystem and swap it
# builds are fixed. Manual partitioning is there for anyone who wants their
# own layout, and install-limine checks what they built before touching the
# boot loader.
initialPartitioningChoice: erase

# Draw logical/nested partitions as visually nested
drawNestedPartitions: false

# Always show partition labels in the manual partitioning view
alwaysShowPartitionLabels: true

# Manual partitioning: root on any filesystem the kernel mounts; on UEFI the
# EFI system partition at /boot/efi, on BIOS a FAT32 /boot of its own. A
# layout outside that is refused by install-limine with the reason. A reused
# Btrfs partition has to be formatted, since the mount step creates the
# subvolumes fresh and stops on ones that already exist.
allowManualPartitioning: true

# Show the "boot partition not encrypted" warning when root is encrypted
showNotEncryptedBootMessage: false

# ---------------------------------------------------------------------------
# Swap
# No swap partition — swap is compressed RAM (zram), configured by
# post-install-system.  Systems that add a real swap partition later still
# get hibernation: gpu-config.sh appends resume= only when one exists.
# ---------------------------------------------------------------------------
userSwapChoices:
    - none

initialSwapChoice: none

# ---------------------------------------------------------------------------
# Encryption
# luksGeneration: luks2 is safe here — Limine supports LUKS2 (unlike GRUB)
# ---------------------------------------------------------------------------
luksGeneration: luks2

# ---------------------------------------------------------------------------
# BIOS auto-partition layout
# Limine's BIOS stages read FAT but not Btrfs or ext4, so BIOS installs carry
# a separate FAT32 /boot (kernels, initramfs, limine.conf, limine-bios.sys).
# UEFI installs keep the stock layout (partition.conf) with /boot inside @
# so pre-update snapshots keep kernel and modules in lockstep.
# noEncrypt keeps /boot plaintext on Encrypt-system installs — Limine BIOS
# must read it before the LUKS root is unlocked.
# ---------------------------------------------------------------------------
partitionLayout:
    - name: "boot"
      filesystem: "fat32"
      mountPoint: "/boot"
      noEncrypt: true
      size: 1GiB
    - name: "root"
      filesystem: "btrfs"
      mountPoint: "/"
      size: 100%
