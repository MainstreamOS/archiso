---
# Partition module config

# ---------------------------------------------------------------------------
# EFI system partition
# Note: efiSystemPartition / efiSystemPartitionSize / efiSystemPartitionName
# are deprecated aliases — use the efi: block below instead (Calamares 3.3+)
# ---------------------------------------------------------------------------
efi:
    mountPoint:      "/boot/efi"
    recommendedSize: 1024MiB
    minimumSize:     512MiB
    label:           "EFI"

# ---------------------------------------------------------------------------
# Filesystem
# ---------------------------------------------------------------------------
defaultFileSystemType: "btrfs"
availableFileSystemTypes:
    - btrfs

# availableFileSystemTypes above reaches only the erase-disk flow, so without
# the rule below manual partitioning would offer every filesystem the kernel
# can create. Snapper works on Btrfs and nothing else we can boot, so a root on
# ext4 or XFS installs and runs fine while quietly having no snapshots and no
# Recovery.
directoryFilesystemRestrictions:
    - directory: "/"
      allowedFilesystemTypes: ["btrfs"]
      message: "Root has to be Btrfs. Snapshots and Recovery are built on it, so on any other filesystem nothing would be saved before an update and there would be nothing to roll back to."
directoryFilesystemRestrictionsEnforced: true

# ---------------------------------------------------------------------------
# Partitioning defaults
# ---------------------------------------------------------------------------
# Force GPT — required for EFI-only installs with Limine
requiredPartitionTableType: gpt

# Erase disk is what the page opens on; the layout, filesystem and swap it
# builds are fixed. Manual partitioning is there for anyone who wants their
# own layout, and install-limine checks what they built before touching the
# boot loader.
initialPartitioningChoice: erase

# Draw logical/nested partitions as visually nested
drawNestedPartitions: false

# Always show partition labels in the manual partitioning view
alwaysShowPartitionLabels: true

# Manual partitioning: root has to be Btrfs. On UEFI the EFI system partition
# sits at /boot/efi: FAT16 or FAT32, not encrypted, with the esp or boot flag.
# On BIOS /boot is a FAT16 or FAT32 partition of its own, not encrypted and at
# least 512 MiB, and a GPT disk holding it also needs a partition with the
# bios-grub flag, where Limine's BIOS stage goes. A layout outside that is
# refused by install-limine with the reason. A reused Btrfs partition has to be
# formatted, since the mount step creates the subvolumes fresh and stops on
# ones that already exist.
allowManualPartitioning: true

# The partition page holds a manual layout to those same rules, while it can
# still be changed. install-limine refusing it comes after the disks have been
# written.
requireBootableLayout: true
requireFormattedRoot: true

# On BIOS, Limine goes to the disk that holds /boot and no install step reads
# this choice, so offering it would only mislead. The GPT-on-BIOS box judges
# that same unused choice rather than the /boot disk, and the check above
# already asks for a bios-grub partition where Limine goes.
showBootLoaderSelector: false
warnGptOnBios: false

# install-limine can start a root on a plain or LUKS partition only, and
# refuses one on LVM. Hiding the LVM buttons keeps that layout from being built
# in the first place.
lvm:
    enable: false

# Show the "boot partition not encrypted" warning when root is encrypted
showNotEncryptedBootMessage: false

# ---------------------------------------------------------------------------
# Swap
# No swap partition — swap is compressed RAM (zram), configured by
# post-install-system. A swap partition the installed system would turn on
# anyway, named in fstab or found by its GPT type on the root's disk, is left
# to post-install-boot. It gets resume= when the root and the swap are both
# plain. Otherwise hibernation is turned off: an encrypted swap opens too late
# to resume from, and a plain one beside an encrypted root would hold memory,
# the root's key included, unencrypted. One found by its GPT type is then also
# named noauto in fstab, which keeps systemd from turning it on at all.
# ---------------------------------------------------------------------------
userSwapChoices:
    - none

initialSwapChoice: none

# ---------------------------------------------------------------------------
# Encryption
# luksGeneration: luks2 is safe here — Limine supports LUKS2 (unlike GRUB)
# ---------------------------------------------------------------------------
luksGeneration: luks2

# ---------------------------------------------------------------------------
# BIOS auto-partition layout
# Limine's BIOS stages read FAT but not Btrfs or ext4, so BIOS installs carry
# a separate FAT32 /boot (kernels, initramfs, limine.conf, limine-bios.sys).
# UEFI installs keep the stock layout (partition.conf) with /boot inside @
# so pre-update snapshots keep kernel and modules in lockstep.
# noEncrypt keeps /boot plaintext on Encrypt-system installs — Limine BIOS
# must read it before the LUKS root is unlocked.
# ---------------------------------------------------------------------------
partitionLayout:
    - name: "boot"
      filesystem: "fat32"
      mountPoint: "/boot"
      noEncrypt: true
      size: 1GiB
    - name: "root"
      filesystem: "btrfs"
      mountPoint: "/"
      size: 100%
