---
# Users module config (Calamares 3.4 schema)

user:
    shell: /usr/bin/zsh
    # Accounts the live image itself uses; the install removes them.
    forbidden_names:
        - liveuser
        - builduser

defaultGroups:
    - wheel
    - network
    - audio
    - video
    - input
    - power
    - storage
    - lp
    - optical
    - render
    - i2c

autologinGroup:  autologin
displayAutologin: true
doAutologin:     false
sudoersGroup:    wheel
setRootPassword: true
doReusePassword: true
allowWeakPasswords: true
allowWeakPasswordsDefault: false

passwordRequirements:
    minLength: 8
    maxLength: -1
    libpwquality:
        - minlen=8
        - minclass=2
