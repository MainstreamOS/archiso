---
# Post-install step: login screen, system settings, snapshots, Proton GE, finalize
i18n:
    name: "Finalizing setup"
dontChroot: false
timeout: 3600

script:
    - "/usr/local/bin/post-install-login"
    - "/usr/local/bin/post-install-system"
    - "/usr/local/bin/post-install-snapshots"
    - "/usr/local/bin/post-install-proton"
