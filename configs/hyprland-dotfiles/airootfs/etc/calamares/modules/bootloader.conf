---
# Bootloader module config (Calamares 3.4 schema)

# Use grub for the EFI fallback that runs before our limine module is
# installed. Limine is then installed on top via shellprocess@limine.
efiBootLoader: "grub"

grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"

# UEFI NVRAM boot entry label and EFI directory name (/boot/efi/EFI/Mainstream/)
efiBootloaderId: "Mainstream"

# Backup boot path at /boot/efi/EFI/BOOT/BOOTX64.EFI
installEFIFallback: true
