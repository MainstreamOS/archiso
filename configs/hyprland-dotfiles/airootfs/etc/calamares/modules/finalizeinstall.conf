---
# Final post-install cleanup pass — runs after install-gpu-drivers has
# installed the correct driver, and before desktopcleanup. Removes the
# wrong CPU microcode, live-only installer tooling (calamares /
# arch-install-scripts / etc.), and the live-only sudoers drop-ins +
# /home/liveuser leftovers. GPU drivers are no longer shipped on the ISO,
# so there is no driver prune. Trades ~250 MB of disk vs a bloated install.
i18n:
    name: "Finalizing installation"
dontChroot: false
timeout: 600

script:
    - "/usr/local/bin/finalize-install"
