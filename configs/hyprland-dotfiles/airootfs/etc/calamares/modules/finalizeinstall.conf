---
# Final post-install cleanup pass — runs after install-gpu-drivers AND the
# packages (netinstall) module, before desktopcleanup. Removes wrong-vendor
# GPU drivers that leaked in via --noconfirm provider auto-selection (e.g.
# Steam pulling lib32-nvidia-utils on AMD), the wrong CPU microcode,
# live-only installer tooling (calamares / arch-install-scripts / etc.),
# and the live-only sudoers drop-ins + /home/liveuser leftovers.
i18n:
    name: "Finalizing installation"
dontChroot: false
timeout: 600

script:
    - "/usr/local/bin/finalize-install"
