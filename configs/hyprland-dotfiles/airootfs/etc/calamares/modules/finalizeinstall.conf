---
# Final post-install prune pass — runs after install-gpu-drivers added
# the correct driver, and before desktopcleanup runs. Removes GPU drivers
# for vendors not present, the wrong CPU microcode, live-only installer
# tooling (calamares / arch-install-scripts / etc.), broadcom-wl when
# there's no Broadcom hardware, and the live-only sudoers drop-ins +
# /home/liveuser leftovers. Trades ~250 MB of disk vs an always-needs-
# to-update bloat-installed system.
i18n:
    name: "Finalizing installation"
dontChroot: false
timeout: 600

script:
    - "/usr/local/bin/finalize-install"
