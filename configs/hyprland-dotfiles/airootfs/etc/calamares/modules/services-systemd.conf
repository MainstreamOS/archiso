---
# Services configuration — matches enabled services on minimal archinstall + dotfiles
# Ground truth: systemctl list-unit-files --state=enabled on working system
#
# This step runs after the install scripts. No entry is mandatory, so a unit
# that is missing or masked is logged and skipped.

units:
    - name: NetworkManager
      action: enable
      mandatory: false
    - name: NetworkManager-dispatcher
      action: enable
      mandatory: false
    - name: bluetooth
      action: enable
      mandatory: false
    - name: firewalld
      action: enable
      mandatory: false
    # avahi-daemon: mDNS/zeroconf responder. Used by Auto Drive Mount's
    # Network tab to discover SMB hosts on the LAN via avahi-browse.
    # Required for the "Found on your network" list to populate.
    - name: avahi-daemon
      action: enable
      mandatory: false
    # The print spooler, reached through its socket rather than its
    # service: systemd starts cups.service on the first print job. The
    # socket has to be named because Arch ships no preset for cups and
    # the default policy is `disable *`. cups.service is not disabled
    # further down: it names the socket in Also=, so disabling it would
    # take the socket with it.
    - name: cups.socket
      action: enable
      mandatory: false
    - name: sddm
      action: enable
      mandatory: false
    - name: systemd-timesyncd
      action: enable
      mandatory: false
    # Periodic weekly SSD TRIM, replacing the continuous discard=async
    # mount option (dropped in mount.conf) — the recommended SSD model.
    - name: fstrim.timer
      action: enable
      mandatory: false
    # NOTE: snapper-cleanup.timer, snapper-timeline.timer, and
    # limine-snapper-sync.service are NOT listed here.  They are enabled
    # by snapper-firstboot AFTER configs are fully set up, to prevent a
    # race where snapperd starts before configs exist and deletes them.

    - name: NetworkManager-wait-online
      action: disable
      mandatory: false
    - name: wpa_supplicant
      action: disable
      mandatory: false
    - name: systemd-networkd
      action: disable
      mandatory: false
    - name: systemd-networkd.socket
      action: disable
      mandatory: false
    - name: systemd-networkd-persistent-storage
      action: disable
      mandatory: false
    - name: systemd-networkd-wait-online
      action: disable
      mandatory: false
    - name: sshd
      action: disable
      mandatory: false
    - name: lvm2-monitor
      action: disable
      mandatory: false
    - name: systemd-udev-settle
      action: disable
      mandatory: false
