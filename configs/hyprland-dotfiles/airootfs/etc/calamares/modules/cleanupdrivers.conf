---
# Hardware-detect prune pass — runs after install-gpu-drivers added the
# correct driver, and before desktopcleanup runs. Removes GPU drivers
# for vendors not present, the wrong CPU microcode, live-only installer
# tooling (calamares / arch-install-scripts / etc.), and broadcom-wl
# when there's no Broadcom hardware. Trades ~250 MB of disk vs an
# always-needs-to-update bloat-installed system.
i18n:
    name: "Cleaning up unused drivers and live-only tools"
dontChroot: false
timeout: 600

script:
    - "/usr/local/bin/cleanup-unused-drivers"
