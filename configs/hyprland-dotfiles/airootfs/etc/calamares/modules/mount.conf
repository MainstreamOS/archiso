---
extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run
    - device: /run/udev
      mountPoint: /run/udev
      options: [ bind ]
    - device: efivarfs
      fs: efivarfs
      mountPoint: /sys/firmware/efi/efivars
      efi: true

btrfsSubvolumes:
    - mountPoint: /
      subvolume: /@
    - mountPoint: /home
      subvolume: /@home
    # Recommended additions for snapshot stability:
    - mountPoint: /var/cache
      subvolume: /@cache
    - mountPoint: /var/log
      subvolume: /@log

mountOptions:
    - filesystem: default
      options: [ defaults ]
    - filesystem: efi
      options: [ defaults, umask=0077 ]
    - filesystem: btrfs
      # No discard=async: on a fresh SSD its first-boot TRIM backlog serialized
      # with the initial subvolume-creation commit (snapper create-config),
      # stalling it ~28s and starving the first paint. Periodic TRIM via
      # fstrim.timer (enabled in services-systemd.conf) is the recommended model.
      options: [ defaults, noatime, compress=zstd ]
      ssdOptions: [ ssd ]