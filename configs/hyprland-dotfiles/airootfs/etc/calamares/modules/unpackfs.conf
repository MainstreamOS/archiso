---
# Unpackfs module - copy the live system's image to the target
#
# Copied from the image the live session already has mounted rather than from
# the image file: it reads the same untouched image whatever format it is in,
# the progress bar can count its files, and it still works after copytoram.
unpack:
    - source: "/run/archiso/airootfs"
      sourcefs: "file"
      destination: ""
      name: "Deploying Arch Linux base system"
