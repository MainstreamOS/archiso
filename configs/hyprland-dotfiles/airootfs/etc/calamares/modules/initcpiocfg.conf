#
# The initcpiocfg module is responsible for the configuration of mkinitcpio.conf.  Typically this
# module is used in conjunction with the initcpio module to generate the boot image when using mkinitcpio
#
---

# Determines if the systemd versions of the hooks should be used.
# Must match the base /etc/mkinitcpio.conf shipped on the live ISO, which
# uses `systemd` + `sd-vconsole`. With this true, Calamares injects
# `sd-encrypt` (the systemd-style LUKS hook) for encrypted installs, which
# also lets systemd-ask-password-plymouth.service forward the passphrase
# prompt to the plymouth splash.
useSystemdHook: true

# In some cases, you may want to use a different source file than /etc/mkinitcpio.conf
source: "/etc/mkinitcpio.conf"

# Bring the generated HOOKS to the MainstreamOS canonical set (kept in sync with
# the dots ./setup path's MKINITCPIO_SYSTEMD_HOOKS):
#   - prepend `base`: the useSystemdHook path drops it, but we want the recovery
#     shell available if the systemd-based init ever fails to boot.
#   - remove `resume`: redundant with the systemd hook, which resumes from
#     hibernation natively via the resume= cmdline. Calamares' dynamic
#     sd-encrypt / lvm2 detection is preserved.
# Canonical result:
#   base systemd autodetect microcode kms modconf block keyboard sd-vconsole plymouth filesystems
hooks:
    prepend:
        - base
    remove:
        - resume

