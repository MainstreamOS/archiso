---
# Post-install verification — re-asserts what the install steps intended
# (live tooling gone, right GPU stack, boot chain, user payload). Advisory:
# results land in /var/log/mainstream-install and failures notify once on
# first login; the leading "-" means a verification problem never aborts an
# otherwise-complete install.
i18n:
    name: "Verifying installation"
dontChroot: false
timeout: 300

script:
    - "-/usr/local/bin/post-install-verify"
