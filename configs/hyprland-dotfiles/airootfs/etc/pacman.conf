#
# /etc/pacman.conf
#
# See the pacman.conf(5) manpage for option and repository directives
#
# GENERAL OPTIONS
#
[options]
# The following paths are commented out with their default values listed.
# If you wish to use different paths, uncomment and update the paths.
#RootDir     = /
#DBPath      = /var/lib/pacman/
#CacheDir    = /var/cache/pacman/pkg/
#LogFile     = /var/log/pacman.log
#GPGDir      = /etc/pacman.d/gnupg/
#HookDir     = /etc/pacman.d/hooks/
HoldPkg     = pacman glibc
#XferCommand = /usr/bin/curl -L -C - -f -o %o %u
#XferCommand = /usr/bin/wget --passive-ftp -c -O %o %u
#CleanMethod = KeepInstalled
Architecture = auto
# Pacman won't upgrade packages listed in IgnorePkg and members of IgnoreGroup
#IgnorePkg   =
#IgnoreGroup =
#NoUpgrade   =
#NoExtract   =
# Nothing on an x86_64 system uses these: bytecode for optimization levels no
# program here runs at, catalogs for locales no language setting reaches,
# Hyprland's own wallpapers, which the shipped config never shows, and firmware
# for chips found only inside ARM and router SoCs.
NoExtract   = *.opt-1.pyc usr/lib/python3.12/*.opt-2.pyc
NoExtract   = usr/share/locale/sr@ijekavian/* usr/share/locale/sr@ijekavianlatin/* usr/share/locale/sr@ije/* usr/share/locale/en@quot/* usr/share/locale/en@boldquot/* usr/share/locale/en@shaw/*
NoExtract   = usr/share/hypr/wall[0-9].png
NoExtract   = usr/lib/firmware/ath11k/WCN6750/* usr/lib/firmware/ath11k/IPQ* usr/lib/firmware/ath12k/IPQ* usr/lib/firmware/ath10k/WCN3990/* usr/lib/firmware/ath10k/QCA4019/*
NoExtract   = usr/lib/firmware/mediatek/mt8[0-9][0-9][0-9]/* usr/lib/firmware/mediatek/sof/* usr/lib/firmware/mediatek/mt798[168]_* usr/lib/firmware/mediatek/mt7622*
NoExtract   = usr/lib/firmware/nvidia/tegra* usr/lib/firmware/nvidia/gm20b/* usr/lib/firmware/nvidia/gp10b/* usr/lib/firmware/nvidia/gk20a/*
NoExtract   = usr/lib/firmware/dpaa2/* usr/lib/firmware/s5p-mfc* usr/lib/firmware/arm/* usr/lib/firmware/powervr/* usr/lib/firmware/meson/* usr/lib/firmware/amlogic/* usr/lib/firmware/cnm/* usr/lib/firmware/amphion/*
# Firmware for other chips links to these two notices. pacman reads the rules
# from the last one up, so a ! rule has to come after the one it overrides.
NoExtract   = !usr/lib/firmware/ath11k/IPQ6018/hw1.0/Notice.txt.zst !usr/lib/firmware/ath10k/QCA4019/hw1.0/notice_ath10k_firmware-5.txt.zst
# Misc options
#UseSyslog
Color
NoProgressBar
# We cannot check disk space from within a chroot environment
#CheckSpace
#VerbosePkgLists
ParallelDownloads = 10
#DownloadUser = alpm
#DisableSandbox
# By default, pacman accepts packages signed by keys that its local keyring
# trusts (see pacman-key and its man page), as well as unsigned packages.
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
#RemoteFileSigLevel = Required
# NOTE: You must run `pacman-key --init` before first using pacman; the local
# keyring can then be populated with the keys of all official Arch Linux
# packagers with `pacman-key --populate archlinux`.
#
# REPOSITORIES
#   - can be defined here or included from another file
#   - pacman will search repositories in the order defined here
#   - local/custom mirrors can be added here or in separate files
#   - repositories listed first will take precedence when packages
#     have identical names, regardless of version number
#   - URLs will have $repo replaced by the name of the current repo
#   - URLs will have $arch replaced by the name of the architecture
#
# Repository entries are of the format:
#       [repo-name]
#       Server = ServerName
#       Include = IncludePath
#
# The header [repo-name] is crucial - it must be present and
# uncommented to enable the repo.
#
# The testing repositories are disabled by default. To enable, uncomment the
# repo name header and Include lines. You can add preferred servers immediately
# after the header, and they will be used before the default mirrors.

# mainstream local repo — pre-built meta-packages from build.sh --refresh
# Must be listed before [core] so mainstream-quickshell-git takes
# precedence over stock quickshell from [extra].
# Populated by running: sudo ./build.sh --refresh from the archiso root directory.
[mainstream]
SigLevel = Never
Server = file:///usr/local/share/pkgs


#[core-testing]
#Include = /etc/pacman.d/mirrorlist
[core]
Include = /etc/pacman.d/mirrorlist
#[extra-testing]
#Include = /etc/pacman.d/mirrorlist
[extra]
Include = /etc/pacman.d/mirrorlist
# If you want to run 32 bit applications on your x86_64 system,
# enable the multilib repositories as required here.
#[multilib-testing]
#Include = /etc/pacman.d/mirrorlist
[multilib]
Include = /etc/pacman.d/mirrorlist

# Chaotic-AUR (disabled - conflicts with official mesa, calamares not present)
#[chaotic-aur]
#Include = /etc/pacman.d/chaotic-mirrorlist

# An example of a custom package repository.  See the pacman manpage for
# tips on creating your own repositories.
#[custom]
#SigLevel = Optional TrustAll
#Server = file:///home/custompkgs
