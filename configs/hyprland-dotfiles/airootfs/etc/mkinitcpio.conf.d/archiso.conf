# Explicit MODULES instead of the `kms` hook: kms auto-bundles every GPU's
# firmware, which baked NVIDIA's GSP blob into the init and overflowed Limine.
# Keeps AMD/Intel early-KMS; NVIDIA loads post-pivot (modprobe.d + udev rule).
MODULES=(amdgpu i915 radeon)
HOOKS=(base udev plymouth keyboard microcode modconf memdisk archiso archiso_loop_mnt archiso_pxe_common archiso_pxe_nbd archiso_pxe_http archiso_pxe_nfs block filesystems)
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(--long -19 -T0)
