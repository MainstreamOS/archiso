title    Mainstream OS - Live (Intel Mac with T2)
sort-key 02
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-mainstream
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-mainstream.img
# t2linux's options for the T2: IOMMU passthrough for its bridge, in-order
# suspend and its Bluetooth driver held back. The live Mac quirks load the
# keyboard and camera drivers once they find the chip.
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3 intel_iommu=on iommu=pt pm_async=off modprobe.blacklist=hci_bcm4377 %KERNEL_PARAMS%
