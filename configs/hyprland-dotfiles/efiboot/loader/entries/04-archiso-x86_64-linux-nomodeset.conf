title    Mainstream OS — Live (Safe graphics)
sort-key 04
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
initrd   /%INSTALL_DIR%/boot/%ARCH%/intel-ucode.img
initrd   /%INSTALL_DIR%/boot/%ARCH%/amd-ucode.img
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
# Fallback for hardware where kernel mode-setting doesn't work — disables
# KMS for every GPU, drops to VESA framebuffer. Slow, low-res, but boots
# on hardware that would otherwise hang at a black screen.
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset vga=normal copytoram=n
