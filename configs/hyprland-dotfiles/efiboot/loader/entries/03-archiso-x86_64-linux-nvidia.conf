title    Mainstream OS — Live (NVIDIA proprietary)
sort-key 03
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
initrd   /%INSTALL_DIR%/boot/%ARCH%/intel-ucode.img
initrd   /%INSTALL_DIR%/boot/%ARCH%/amd-ucode.img
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
# Force the proprietary / open NVIDIA driver path. Useful for setups
# where nouveau hangs on boot or displays at the wrong refresh rate.
# nvidia-drm.modeset=1 + nvidia_drm.fbdev=1 give a smooth KMS handover
# (no terminal flicker on session start).
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3 nvidia-drm.modeset=1 nvidia_drm.fbdev=1 copytoram=n
