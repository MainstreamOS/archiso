title    Mainstream OS — Live (open-source GPU drivers)
sort-key 02
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
initrd   /%INSTALL_DIR%/boot/%ARCH%/intel-ucode.img
initrd   /%INSTALL_DIR%/boot/%ARCH%/amd-ucode.img
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
# Force nouveau for NVIDIA hardware (skip the proprietary path for users
# who hit a nvidia-open quirk and want to fall back). AMD and Intel are
# unaffected — amdgpu / i915 KMS still run normally.
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3 nvidia.modeset=0 nouveau.modeset=1 copytoram=n
