# BIOS / legacy syslinux entries — mirror the UEFI efiboot/loader/entries
# four-entry layout. Both microcodes are referenced in INITRD; the CPU
# applies whichever matches its vendor and ignores the other.

LABEL arch
TEXT HELP
Default boot — works on the vast majority of hardware.
ENDTEXT
MENU LABEL Mainstream OS - Live (default)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/intel-ucode.img,/%INSTALL_DIR%/boot/%ARCH%/amd-ucode.img,/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3 copytoram=n

LABEL archopen
TEXT HELP
Forces nouveau for NVIDIA users who hit a nvidia-open quirk.
AMD and Intel are unaffected.
ENDTEXT
MENU LABEL Mainstream OS - Live (open-source GPU drivers)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/intel-ucode.img,/%INSTALL_DIR%/boot/%ARCH%/amd-ucode.img,/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3 nvidia.modeset=0 nouveau.modeset=1 copytoram=n

LABEL archnvidia
TEXT HELP
Forces the NVIDIA proprietary / nvidia-open KMS path.
Useful when nouveau hangs the live session.
ENDTEXT
MENU LABEL Mainstream OS - Live (NVIDIA proprietary)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/intel-ucode.img,/%INSTALL_DIR%/boot/%ARCH%/amd-ucode.img,/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3 nvidia-drm.modeset=1 nvidia_drm.fbdev=1 copytoram=n

LABEL archnomodeset
TEXT HELP
Fallback for hardware where KMS doesn't work at all.
Low-res VESA framebuffer, but boots when nothing else does.
ENDTEXT
MENU LABEL Mainstream OS - Live (^Safe graphics)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/intel-ucode.img,/%INSTALL_DIR%/boot/%ARCH%/amd-ucode.img,/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset vga=normal copytoram=n
