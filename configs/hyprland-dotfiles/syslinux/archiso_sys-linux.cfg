# BIOS / legacy syslinux entries — mirror the UEFI efiboot/loader/entries
# layout (default + Safe graphics). No microcode image is listed: the mkinitcpio
# `microcode` hook builds it into initramfs-linux.img, so mkarchiso emits no
# standalone ucode files and syslinux would abort on the missing component.

LABEL arch
TEXT HELP
Default boot — works on the vast majority of hardware.
ENDTEXT
MENU LABEL Mainstream OS - Live (default)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3 copytoram=n cow_spacesize=1G

LABEL archnomodeset
TEXT HELP
Fallback for hardware where KMS doesn't work at all.
Low-res VESA framebuffer, but boots when nothing else does.
ENDTEXT
MENU LABEL Mainstream OS - Live (^Safe graphics)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset vga=normal copytoram=n cow_spacesize=1G
